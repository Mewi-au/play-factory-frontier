<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>Factory Frontier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>/* Layout: full-bleed canvas world, HUD floats top, tab rail bottom, bottom-sheet panels. Single dark industrial theme by design. */
:root{
  --bg:#11161d; --panel:#19212b; --panel2:#212b37; --line:#2e3a48; --fg:#e9ecef; --mut:#93a0b0;
  --acc:#e9a23b; --acc-d:#9c6420; --pw:#4fb8b0; --ok:#7cc68b; --warn:#e9c46a; --bad:#e2665a;
  --cr:#e9c46a; --co:#6cc3e0; --ch:#8fd19e;
  --f-d:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-b:Barlow,"Segoe UI",system-ui,sans-serif;
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 var(--f-b);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.mono{font-variant-numeric:tabular-nums;font-family:var(--f-d)}
.muted{color:var(--mut)} .sm{font-size:12px} .c{text-align:center} small{color:var(--mut);font-weight:500}
svg{width:18px;height:18px;fill:currentColor}

/* HUD */
#hud{z-index:2;position:absolute;left:0;right:0;top:0;padding:calc(var(--sa-t) + 8px) 10px 8px;display:flex;flex-direction:column;gap:6px;pointer-events:none;background:linear-gradient(var(--bg) 0%,rgba(16,21,27,.75) 60%,rgba(16,21,27,0))}
#hud>*{pointer-events:auto}
.hud-row{display:flex;align-items:center;gap:8px}
.pwr{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:600 13px var(--f-d);position:relative;overflow:hidden;min-width:0}
.pwr svg{fill:var(--pw);width:14px;height:14px;flex:none}
.pwr i{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)} .pwr i b{display:block;height:100%;background:var(--pw);transition:width .3s}
.pwr.bad svg{fill:var(--bad)} .pwr.bad i b{background:var(--bad)}
.curs{display:flex;gap:6px;flex:1;justify-content:flex-end;min-width:0}
.cur{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:600 13px var(--f-d);font-variant-numeric:tabular-nums}
.cur i,.cur-c::before,.cur-k::before,.cur-h::before{display:inline-block;width:11px;height:11px;flex:none;content:""}
.g-cr,.cur-c::before{background:var(--cr);border-radius:50%;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.g-co,.cur-k::before{background:var(--co);transform:rotate(45deg);border-radius:2px}
.g-ch,.cur-h::before{background:var(--ch);border-radius:2px;box-shadow:inset 0 0 0 2px #2c5a33}
.cur-c,.cur-k,.cur-h{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--f-d)}
.gear{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:32px;height:30px;display:grid;place-items:center;color:var(--mut);flex:none}
.goal{display:flex;gap:8px;align-items:center;align-self:flex-start;max-width:100%;background:rgba(24,32,41,.92);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:6px 10px;font-size:13px;text-align:left}
.gk{font:700 10px var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);flex:none}
#resmini{align-self:flex-start;display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:rgba(24,32,41,.92);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;min-width:180px}
#resmini .bar{grid-column:1/-1}
#surge{align-self:flex-start;background:var(--acc);color:#1b1206;font:700 11px var(--f-d);letter-spacing:.06em;padding:3px 8px;border-radius:4px}

/* tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(var(--sa-b) + 4px);z-index:5}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--f-d);letter-spacing:.04em;color:var(--mut);padding:5px 0;border-radius:8px;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--acc);background:var(--panel2)}
.badge{position:absolute;top:3px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:calc(58px + var(--sa-b));max-height:58%;display:flex;flex-direction:column;background:var(--bg);border-top:2px solid var(--acc);border-radius:14px 14px 0 0;z-index:4;box-shadow:0 -10px 30px rgba(0,0,0,.45);max-width:620px;margin:0 auto}
.sh-head{display:flex;align-items:center;padding:10px 16px 6px}
.sh-head h2{flex:1;margin:0;font:700 19px var(--f-d);letter-spacing:.02em;text-wrap:balance}
.x{width:32px;height:32px;border-radius:8px;background:var(--panel);color:var(--mut)}
#sh-tabs:empty{display:none} #sh-tabs{padding:0 16px 6px}
#sh-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;user-select:none}
.seg{display:flex;background:var(--panel);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:6px;font:600 12px var(--f-d);color:var(--mut);position:relative}
.seg button.on{background:var(--panel2);color:var(--fg)}
.dot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card.row,.row{display:flex;flex-direction:row;align-items:center;gap:10px}
.row.gap{gap:8px;flex-wrap:wrap} .row.between{justify-content:space-between} .grow{flex:1;min-width:0}
.card.locked{opacity:.55} .card.mini{flex-direction:row;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px}
.card.warn{border-color:var(--warn);color:var(--warn)}
.card.ready{border-color:var(--ok)} .card.running{border-color:var(--pw)}
.card.hero{background:linear-gradient(160deg,var(--panel2),var(--panel));border-color:#3a4757}
.ttl{font:600 15px var(--f-d)} .ttl.big{font-size:20px} .ttl small{font:500 12px var(--f-b)}
.eyebrow{font:700 10px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.desc{font-size:13px;color:var(--mut)}
.lock{font-size:12px;color:var(--acc)}
.note{font-size:12px;color:var(--mut);white-space:nowrap}
.ic{width:20px;height:20px;vertical-align:middle;flex:none;image-rendering:auto} .ic.lg{width:32px;height:32px}
.bic{width:46px;height:46px;flex:none;background:var(--panel2);border-radius:8px}
.cost{display:flex;flex-wrap:wrap;gap:5px}
.ci{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px 2px 3px;font-size:12px}
.ci b{font:600 12px var(--f-d);font-variant-numeric:tabular-nums;color:var(--bad)} .ci.ok b{color:var(--ok)}
.ci em{font-style:normal;color:var(--mut);font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--panel2);border-radius:4px;padding:2px 6px 2px 3px} .tag .ic{width:16px;height:16px}
.tag.zone{color:var(--acc);padding-left:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 13px var(--f-d);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1b1206}
.btn.core{background:#123548;border-color:var(--co);color:var(--co)}
.btn.credit{background:#3a3112;border-color:var(--cr);color:var(--cr)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn.sm{padding:4px 8px;min-height:28px;font-size:12px}
.btn.wide{width:100%} .btn.big{min-height:48px;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.seg button:focus-visible,#tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--mut);transition:width .3s}
.bar.acc i{background:var(--acc)} .bar.pw i{background:var(--pw)} .bar.bad i{background:var(--bad)} .bar.full i{background:var(--warn)}
.statusline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font:700 11px var(--f-d);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--panel2)}
.s-run{color:var(--ok);background:rgba(124,198,139,.12)} .s-low,.s-starve{color:var(--warn);background:rgba(233,196,106,.12)} .s-full{color:var(--bad);background:rgba(226,102,90,.12)} .s-off,.s-idle{color:var(--mut)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .flow.center{justify-content:center}
.io{display:flex;flex-direction:column;align-items:center;min-width:60px;font-size:13px} .io b{font:600 14px var(--f-d)} .io small{font-size:11px;text-align:center}
.arrow{font:700 20px var(--f-d);color:var(--acc)}
.recipe{cursor:pointer} .recipe.sel{border-color:var(--acc)}
.rx{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font:600 12px var(--f-d)} .op{color:var(--mut);margin:0 3px}
.line{padding:6px 0;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px} .kv span{color:var(--mut)} .kv b{font-family:var(--f-d);font-variant-numeric:tabular-nums}
.tierhead{font:700 11px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:6px} .tierhead small{letter-spacing:0;text-transform:none;color:var(--acc)}
.donelist{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ok)}
.bays{display:flex;flex-direction:column;gap:6px}
.bay{background:var(--panel2);border:1px solid var(--pw);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.bay .btn{align-self:flex-end} .bay.idle{border-style:dashed;border-color:var(--line);color:var(--mut)}
.inv{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)} .inv .row{gap:10px;font-size:13px}
.rate{min-width:64px;text-align:right;color:var(--mut)} .rate.up{color:var(--ok)} .rate.down{color:var(--bad)}
.phases{display:flex;gap:4px} .ph{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;font-size:11px;color:var(--mut)}
.ph b{font:700 15px var(--f-d)} .ph.done{border-color:var(--ok);color:var(--ok)} .ph.now{border-color:var(--acc);color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:10px;line-height:1.2;min-width:0}
.day small{font:700 9px var(--f-d)} .day.got{opacity:.45} .day.today{border-color:var(--acc);background:#2a1f10}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 3px;text-align:center;display:flex;flex-direction:column;font-size:10px;min-width:0}
.stg b{font:600 13px var(--f-d)} .stg.got{border-color:var(--ok);opacity:.6} .stg.now{border-color:var(--acc)}
.rw{color:var(--cr)}
.pass{display:flex;flex-direction:column;gap:4px}
.pt{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:stretch;font-size:12px;opacity:.6} .pt.ok{opacity:1}
.pt>b{font:700 14px var(--f-d);display:grid;place-items:center;background:var(--panel);border-radius:6px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.pc.prem{border-color:#2a5870;background:#13222c} .pc.lockp{opacity:.6} .pc em{color:var(--ok);font-style:normal}
.balance{font:600 16px var(--f-d);display:flex;align-items:center;gap:8px;flex-wrap:wrap} .balance small{font:500 12px var(--f-b)}
.pk{font-size:16px;min-width:64px}
.sw{width:46px;height:26px;border-radius:6px;border:3px solid;display:grid;place-items:center;flex:none} .sw i{width:60%;height:3px}
textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace;user-select:text;-webkit-user-select:text}

/* place bar */
#placebar{position:absolute;left:10px;right:10px;bottom:calc(66px + var(--sa-b));display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--ok);border-radius:10px;padding:8px 10px;z-index:4;max-width:600px;margin:0 auto}
#placetxt{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0} #placetxt img{width:30px;height:30px}

/* toasts / modal */
#toasts{z-index:8;position:absolute;left:10px;right:10px;top:calc(var(--sa-t) + 120px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:8}
.toast{background:rgba(24,32,41,.96);border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:8px;padding:8px 12px;font-size:13px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.good{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.out{opacity:0;transform:translateY(-6px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#modal{position:absolute;inset:0;background:rgba(6,9,12,.7);display:grid;place-items:center;padding:16px;z-index:10}
.modal-card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.modal-card h2{margin:0;font:700 22px var(--f-d);text-wrap:balance} .modal-card p{margin:0;font-size:14px}
.gains{display:grid;grid-template-columns:repeat(2,1fr);gap:6px} .gains span{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:6px;padding:5px 8px;font:600 13px var(--f-d)} .gains .ic{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){#sheet{left:16px;right:auto;width:420px;bottom:calc(66px + var(--sa-b));border-radius:14px;border:1px solid var(--line);border-top:2px solid var(--acc);max-height:70%}}

/* resources sidebar */
#sb-tog{position:absolute;right:0;top:calc(var(--sa-t) + 150px);width:30px;height:44px;background:var(--panel);border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;display:grid;place-items:center;color:var(--acc);z-index:3}
#sb-tog.open{right:156px}
#sidebar{position:absolute;right:0;top:calc(var(--sa-t) + 96px);max-height:min(46vh,380px);border-bottom:1px solid var(--line);border-radius:0 0 0 10px;width:156px;background:rgba(16,21,27,.93);border-left:1px solid var(--line);z-index:3;display:flex;flex-direction:column}
.sb-h{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;font:700 11px var(--f-d);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.sb-h small{flex:1;letter-spacing:0;text-transform:none} .sb-h button{font:600 11px var(--f-d);color:var(--acc)}
#sb-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sbr{display:grid;grid-template-columns:20px 1fr auto;grid-template-rows:auto auto;gap:0 6px;align-items:center;width:100%;padding:5px 8px;border-bottom:1px solid rgba(45,57,70,.6);text-align:left}
.sbr img{grid-row:1/3} .sbn{grid-column:2/4;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sbn i{font-style:normal;color:var(--pw);font-weight:700}
.sbr b{font-size:13px} .sbr em{font-style:normal;font-size:11px;color:var(--mut);text-align:right} .sbr em.up{color:var(--ok)} .sbr em.down{color:var(--bad)} .sbr.full b{color:var(--warn)}
/* alliance */
.atag{font:700 12px var(--f-d);border:2px solid;border-radius:6px;padding:4px 6px;min-width:44px;text-align:center;flex:none} .atag.big{font-size:15px;padding:8px}
.war{display:grid;grid-template-columns:1fr;gap:4px} .war>div:not(.bar){display:flex;justify-content:space-between;font-size:13px} .war .bar{height:10px}
.inv.me{background:rgba(233,162,59,.1);border-radius:6px} .rk{min-width:24px;color:var(--mut)} .card.sel{border-color:var(--acc)}
input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:15px var(--f-b);user-select:text;-webkit-user-select:text}
.lvpips{display:flex;gap:3px} .lvpips i{flex:1;height:7px;border-radius:2px;background:var(--line)} .lvpips i.on{background:var(--acc)}
.ascbox{border:1px solid var(--ac);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--ac) 10%,transparent)}
.bar.cyc{height:9px} .bar.cyc i{transition:none}
#beltbar{position:absolute;left:10px;right:10px;bottom:calc(66px + var(--sa-b));display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--pw);border-radius:10px;padding:10px;z-index:4;max-width:600px;margin:0 auto}
#belttxt{display:flex;flex-direction:column;gap:2px;font-size:13px} #belttxt span{color:var(--mut)} #beltbar .row .btn{flex:1}
.tiltshift{position:absolute;left:0;right:0;pointer-events:none;z-index:1;display:none;-webkit-backdrop-filter:blur(2.4px) saturate(1.06);backdrop-filter:blur(2.4px) saturate(1.06)}
#app.tilt .tiltshift{display:block}
.tiltshift.top{top:0;height:30%;-webkit-mask-image:linear-gradient(#000 0%,#000 25%,transparent 100%);mask-image:linear-gradient(#000 0%,#000 25%,transparent 100%)}
.tiltshift.bot{bottom:0;height:26%;-webkit-mask-image:linear-gradient(transparent 0%,#000 75%,#000 100%);mask-image:linear-gradient(transparent 0%,#000 75%,#000 100%)}
.g-sh{display:inline-block;width:11px;height:11px;background:#a68be0;clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
#tut{position:absolute;left:10px;right:10px;bottom:calc(72px + var(--sa-b));z-index:9;max-width:520px;margin:0 auto;background:var(--panel2);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tut.top{bottom:auto;top:calc(var(--sa-t) + 96px)} #tut .desc{color:var(--fg);font-size:14px} #tut .x.sm{width:auto;height:26px;padding:0 10px;font:600 12px var(--f-d)}
#tut-ring{position:absolute;z-index:9;pointer-events:none;border:3px solid var(--acc);border-radius:12px;box-shadow:0 0 0 4000px rgba(5,8,12,.28),0 0 18px var(--acc);animation:tutp 1.2s ease-in-out infinite}
@keyframes tutp{50%{border-color:#ffd38a;box-shadow:0 0 0 4000px rgba(5,8,12,.28),0 0 30px #ffd38a}}

/* ---- status indicators ---- */
.pwr{--pc:var(--ok)} .pwr svg{fill:var(--pc)} .pwr i b{background:var(--pc)!important;transition:width .3s,background .6s}
.pwr.crit{animation:pcrit 2.2s ease-in-out infinite} .pwr.crit svg{fill:var(--bad)}
@keyframes pcrit{50%{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 14px rgba(226,102,90,.55);background:rgba(90,24,20,.9)}}
@keyframes slowblink{50%{opacity:.25}}
#sb-tog.alert{border-color:var(--bad);animation:pcrit 2.2s ease-in-out infinite}
#sb-tog.alert::after{content:'!';position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font:700 11px/16px var(--f-d);text-align:center;animation:slowblink 1.8s ease-in-out infinite}
.sbn u{text-decoration:none;font-weight:700;margin-right:3px} .sbn u.blk{color:var(--bad);animation:slowblink 1.8s ease-in-out infinite} .sbr.sinkf b{color:#c79bff} .sbr.sinkf u{color:#c79bff}
.sbr.full{background:rgba(226,102,90,.08)}
.alerts{align-self:flex-start;display:flex;gap:6px;align-items:center;background:rgba(60,20,18,.92);border:1px solid var(--bad);border-radius:6px;padding:4px 10px;font:600 12px var(--f-d);color:#ffd2cc;animation:pcrit 2.2s ease-in-out infinite}
.alerts b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px}
.blinkc{animation:pcrit 2.2s ease-in-out infinite}
.bar.lowb i{background:var(--bad)}
.s-noinput,.s-nobelt{color:var(--bad);background:rgba(226,102,90,.12)} .s-full{color:#e9a23b;background:rgba(233,162,59,.12)}
@media (prefers-reduced-motion:reduce){.pwr.crit,#sb-tog.alert,.alerts,.blinkc,.sbn u.blk{animation:none}}
/* ---- decor ---- */
#placetxt{flex-wrap:wrap} #placetxt>span{flex:1 1 160px}
.dsw{width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--acc);font-size:18px;background:#1c242d;transform:rotate(45deg) scale(.78)}

.btn.pulse{animation:pcrit 1.6s ease-in-out infinite;border-color:var(--acc)}

#tut.mini{right:auto;padding:0;border-radius:20px;background:var(--panel2)} #tut.mini.top{top:calc(var(--sa-t) + 96px)}
.tutpill{display:flex;gap:6px;align-items:center;padding:7px 12px;font:600 12px var(--f-d);color:var(--fg)} .tutpill .eyebrow{margin:0}

/* ---- mobile ergonomics ---- */
html,body{touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
small{font-size:max(11px,.82em)}
.eyebrow{font-size:11px}
.cur{min-height:36px;padding:6px 10px} .pwr{min-height:36px;padding:6px 10px}
.gear{width:40px;height:36px}
.x{width:40px;height:40px;font-size:16px}
.seg button{padding:11px 4px;font-size:13px}
.btn{min-height:40px;min-width:44px}
.btn.sm{min-height:36px;min-width:40px;padding:6px 10px}
#tabs button{font-size:12px;padding:7px 0 6px;min-height:52px}
#sb-tog{width:36px;height:52px}
#sheet{max-height:72%;touch-action:pan-y}
#sheet::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sh-head{padding-top:16px;touch-action:none}
#sh-body{overscroll-behavior:contain}
.alerts{min-height:34px}
/* atmosphere overlay: sun, vignette and drifting cloud shadows composited by the GPU */
#atmo{position:absolute;inset:0;pointer-events:none;z-index:1;display:none;overflow:hidden;
  background:radial-gradient(circle at 0 0,rgba(255,238,200,.13),rgba(255,238,200,0) 55%),radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 58%,rgba(0,0,0,.30) 100%)}
#app.light #atmo{display:block}
#atmo i{position:absolute;width:140vmax;height:90vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(15,25,40,.13),rgba(15,25,40,0));animation:cloud 90s linear infinite;will-change:transform}
#atmo i:nth-child(1){top:-20vmax;left:-140vmax}
#atmo i:nth-child(2){top:30vmax;left:-140vmax;animation-duration:120s;animation-delay:-50s}
#atmo i:nth-child(3){top:70vmax;left:-140vmax;animation-duration:105s;animation-delay:-85s}
@keyframes cloud{to{transform:translateX(300vmax)}}
@media (prefers-reduced-motion:reduce){#atmo i{animation:none}}
/* portrait only on phones */
#rotate{display:none}


.toast.bump{animation:tbump .25s ease}
@keyframes tbump{50%{transform:scale(1.05)}}
.day{font-size:11px;padding:6px 2px} .day small{font-size:11px}

#atmo i{display:none}
/* ---- landscape: panels dock to the right, guide sits bottom-left, compact tab rail ---- */
@media (orientation:landscape) and (max-height:640px){
  #hud{padding-left:calc(env(safe-area-inset-left,0px) + 10px);padding-right:calc(env(safe-area-inset-right,0px) + 10px)}
  #sheet{left:auto;right:env(safe-area-inset-right,0px);top:calc(var(--sa-t) + 6px);bottom:calc(52px + var(--sa-b));width:min(440px,50vw);max-height:none;border-top:0;border-left:2px solid var(--acc);border-radius:14px 0 0 14px}
  #sheet::before{display:none}
  .sh-head{padding-top:10px}
  #tabs{padding-left:calc(env(safe-area-inset-left,0px) + 4px);padding-right:calc(env(safe-area-inset-right,0px) + 4px)}
  #tabs button{min-height:44px;flex-direction:row;justify-content:center;gap:6px;padding:4px 0}
  #tabs button svg{width:18px;height:18px}
  #tut,#tut.top{left:calc(env(safe-area-inset-left,0px) + 10px);right:auto;width:min(400px,46vw);margin:0;top:auto;bottom:calc(58px + var(--sa-b))}
  #placebar,#beltbar{left:calc(env(safe-area-inset-left,0px) + 10px);right:auto;width:min(560px,60vw);margin:0;bottom:calc(58px + var(--sa-b))}
  #sidebar{max-height:calc(100vh - 160px)}
  #toasts{top:calc(var(--sa-t) + 60px)}
}

.ci em .lk{font-style:normal;color:var(--warn,#e9a23b)}
</style>

function runFor(sec){

// ---------- costs ----------

function refund(c){for(const k in c) S.inv[k]=(S.inv[k]||0)+c[k];}

  if(S.drives<1) return toast('Need a Survey Log (found by scout drones)','bad'); if(!freeSlot()) return toast('All research bays busy','bad'); if(!canPay(a.cost)) return toast('Need '+missing(a.cost),'bad');
  pay(a.cost); S.drives--; S.research.push({kind:'a',id,start:now(),end:now()+a.t/mods().research*1000}); emit('change'); }
// ---------- levels & ascension ----------
function lvCost(b){ const d=BUILDINGS[b.t], lv=b.lv||1, asc=b.asc||0, nx=lv+1, m=Math.pow(1.55,lv-1)*Math.pow(4,asc), a3=Math.pow(3,asc), o={};
  for(const k in d.cost) o[k]=Math.ceil(d.cost[k]*m*.8);
  if(nx>=4) o.reinforced_plate=(o.reinforced_plate||0)+Math.ceil(3*Math.pow(1.35,nx-4)*a3);
  if(nx>=7) o.frame=(o.frame||0)+Math.ceil(2*Math.pow(1.35,nx-7)*a3);
  if(nx>=10) o.motor=(o.motor||0)+Math.ceil(3*a3); return o; }
const LVd=D.LEVELS;
const lvTime = b => Math.min(LVd.cap, LVd.times[(b.lv||1)-1]*LVd.tierMult[LVd.tier[b.t]||0]*Math.pow(LVd.ascTime,b.asc||0))*jobMult();
const ascTime = b => Math.min(LVd.cap, LVd.ASC[b.asc||0].t)*jobMult();
function levelUp(id){ const b=S.buildings.find(b=>b.id===id); if(!b) return; if(b.job) return toast('Busy','bad'); if((b.lv||1)>=LVd.max) return;
  const c=lvCost(b); if(!canPay(c)) return toast('Need '+missing(c),'bad'); pay(c); b.job={k:'lv',to:(b.lv||1)+1,cost:c,dur:lvTime(b)*1000,q:true,c:now()}; startJobs(now()); toast(`Lv ${(b.lv||1)+1} upgrade queued`,'good'); emit('change'); }
function ascend(id){ const b=S.buildings.find(b=>b.id===id); if(!b) return; if(b.job) return toast('Busy','bad'); const asc=b.asc||0; if((b.lv||1)<LVd.max||asc>=LVd.ascMax) return;
  const A=LVd.ASC[asc]; if(!canPay(A.cost)) return toast('Need '+missing(A.cost),'bad'); if(S.chips<A.chips) return toast(`Need ${A.chips} Overclock Chips`,'bad');
  pay(A.cost); S.chips-=A.chips; b.job={k:'asc',to:asc+1,cost:A.cost,chips:A.chips,dur:ascTime(b)*1000,q:true,c:now()}; startJobs(now()); toast(`Ascension to ${A.n} queued`,'good'); emit('change'); }
function setReserve(it,v){ S.reserve[it]=Math.max(0,v|0); if(!S.reserve[it]) delete S.reserve[it]; dirty(); }
function toggle(id){ const b=S.buildings.find(b=>b.id===id); if(b){b.off=!b.off; emit('change');} }
// [item, ore per item, keep-topped-up level, items/min]
const PRESS=[['iron_plate',[['iron_ingot',1.5],['iron_ore',3]],20,6],['iron_rod',[['iron_ingot',1],['iron_ore',2]],12,4]];
const HAND={iron_plate:{in:{iron_ore:3},n:1},iron_rod:{in:{iron_ore:2},n:1},plate_i:{o:'iron_plate',in:{iron_ingot:3},n:2},rod_i:{o:'iron_rod',in:{iron_ingot:1},n:1},screw:{in:{iron_rod:1},n:4,req:'r:screw'},wire:{in:{copper_ore:2},n:2,req:'r:wire'},concrete:{in:{limestone:3},n:1,req:'r:concrete'}};
function craft(key,times=1){ const h=HAND[key], it=h.o||key; if(h.req&&!has(h.req)) return; let n=0; while(n<times&&canPay(h.in)){ pay(h.in); S.inv[it]=(S.inv[it]||0)+h.n; n++; } if(!n) return toast('Need '+missing(h.in)+'. Tap ore nodes on the map to gather ore by hand.','bad'); toast(`Crafted ${n*h.n} ${ITEMS[it].n}`,'good'); buzz(5); emit('change'); }
// drones carry everything sitting inside a machine (input + output buffers) back to the Core
function unload(id){ const b=S.buildings.find(x=>x.id===id); if(!b) return 0; const c=cap(); let moved=0;
  for(const buf of [b.ib,b.ob]){ if(!buf) continue; for(const i in buf){ const a=Math.floor(Math.min(buf[i],Math.max(0,c-(S.inv[i]||0)))); if(a>0){ buf[i]-=a; S.inv[i]=(S.inv[i]||0)+a; moved+=a; } } }
  toast(moved?`Drones carried ${moved} item${moved>1?'s':''} to the Core`:'Nothing to unload (or the Core is full)',moved?'good':'bad'); emit('change'); return moved; }
const held=b=>[b.ib,b.ob].reduce((a,o)=>a+Object.values(o||{}).reduce((x,v)=>x+Math.floor(v),0),0);
function handMine(n){ if(n.res==='oil'||n.res==='geyser') return 0; const a=1+lv('u_mine'); S.inv[n.res]=(S.inv[n.res]||0)+a; S.stats.taps++; buzz(5); return a; }

// ---------- research ----------
const upTime = id => UP[id].times ? UP[id].times[lv(id)] : Math.min(6*3600, UP[id].t0*Math.pow(1.3,lv(id)));
const beltCap = () => D.BELTS[Math.min(lv('u_belt'),D.BELTS.length-1)].cap*(S.stech.st_belt?1.15:1);
const offCap = () => (4+lv('u_off')+(S.stech.st_night?2:0))*3600;
function upCost(id){ if(UP[id].costs) return {...UP[id].costs[lv(id)]}; const u=UP[id], l=lv(id), bi=Math.min(Math.floor(l/3),u.bands.length-1), m=Math.pow(1.4,l-bi*3), o={}; for(const k in u.bands[bi]) o[k]=Math.ceil(u.bands[bi][k]*m); return o; }
const resDur = (kind,id) => (kind==='m'?MS[id].t:upTime(id))/mods().research*1000;
const reqMet = r => r.startsWith('lift') ? S.lift.phase>=+r.slice(4) : !!S.ms[r];
function depDone(id){ const m=MS[id], d=S.dep[id]||{}; return Object.keys(m.cost).every(k=>(d[k]||0)>=m.cost[k])&&(d.shards||0)>=(m.shards||0); }
function msState(id){ if(S.ms[id]) return 'done'; if(S.research.some(r=>r.id===id)) return 'running'; if(!(MS[id].req||[]).every(reqMet)) return 'locked'; return depDone(id)?'ready':'open'; }
const freeSlot = () => S.research.length<S.slots;
function moveInto(cost,dep){ let moved=0; for(const k in cost){ const g=Math.min(Math.floor((S.inv[k]||0)+1e-6),cost[k]-(dep[k]||0)); if(g>0){S.inv[k]-=g; dep[k]=(dep[k]||0)+g; moved+=g;} } return moved; }
function deposit(id){ const d=S.dep[id]=S.dep[id]||{}; let mv=moveInto(MS[id].cost,d); const ns=(MS[id].shards||0)-(d.shards||0); if(ns>0&&S.shards>0){ const g=Math.min(S.shards,ns); S.shards-=g; d.shards=(d.shards||0)+g; mv+=g; } if(!mv) toast('Nothing to deposit yet'); if(depDone(id)&&freeSlot()) startMs(id); emit('change'); }
function startMs(id){ if(msState(id)!=='ready') return; if(!freeSlot()) return toast('All research bays busy','bad');
  S.research.push({kind:'m',id,start:now(),end:now()+resDur('m',id)}); emit('change'); }
function startUp(id){ const u=UP[id]; if(u.req&&!S.ms[u.req]) return toast('Research '+MS[u.req].n+' first','bad'); if(u.max&&lv(id)>=u.max) return toast('Maxed');
  if(S.research.some(r=>r.id===id)) return toast('Already researching'); if(!freeSlot()) return toast('All research bays busy','bad');
  const c=upCost(id); if(!canPay(c)) return toast('Need '+missing(c),'bad'); pay(c);
  S.research.push({kind:'u',id,start:now(),end:now()+resDur('u',id)}); emit('change'); }
const rushCost = end => Math.max(1,Math.ceil((end-now())/1000/300));
function rush(id){ const r=S.research.find(r=>r.id===id); if(!r) return; const c=rushCost(r.end); if(S.cores<c) return toast(`Need ${c} Data Cores`,'bad'); S.cores-=c; r.end=now(); tickTimers(); }
function finish(r){
  if(r.kind==='s'){ S.stech[r.id]=1; if(r.id==='st_bay') S.slots++; dirty(); toast('Shard Tech complete: '+D.SHARD_TECH.find(x=>x.id===r.id).n,'good'); emit('change'); return; }
  if(r.kind==='a'){ S.alts[r.id]=1; dirty(); toast('Alternate recipe ready: '+D.ALTS[r.id].n,'good'); emit('change'); return; }
  if(r.kind==='m'){ if(r.id==='m_scout') S.drives+=1; S.ms[r.id]=1; dirty(); passXP(25); toast('Research complete: '+MS[r.id].n,'good');
    const z=MS[r.id].unl.find(u=>u.startsWith('z:')); if(z) emit('reveal',+z.slice(2)); }
  else { S.upg[r.id]=lv(r.id)+1; toast(`${UP[r.id].n} → Lv ${S.upg[r.id]}`,'good'); }
  emit('change');
}
// ---------- orbital lift ----------
function liftDeposit(){ const ph=S.lift.phase; if(ph>=LIFT.length||S.lift.build) return;
  if(!moveInto(LIFT[ph].cost,S.lift.dep)) toast('Nothing to deliver yet');
  if(Object.keys(LIFT[ph].cost).every(k=>(S.lift.dep[k]||0)>=LIFT[ph].cost[k])){ S.lift.build={start:now(),end:now()+LIFT[ph].t*1000/mods().research}; toast('Lift construction started','good'); emit('lift'); }
  emit('change'); }
function liftRush(){ const b=S.lift.build; if(!b) return; const c=rushCost(b.end); if(S.cores<c) return toast(`Need ${c} Data Cores`,'bad'); S.cores-=c; b.end=now(); tickTimers(); }
function launch(){ if(S.lift.phase<LIFT.length) return; S=fresh(S); dirty(); ensurePeriodic(); emit('launch'); save(); }

// ---------- timers / periodic ----------
function tickTimers(){
  const t=now();
  for(let g=0;g<500;g++){ const a=activeJobs().filter(b=>b.job.e<=t).sort((x,y)=>x.job.e-y.job.e)[0]; if(!a) break; const e=a.job.e; finishJob(a); startJobs(e); }
  startJobs(t);
  for(const r of [...S.research]) if(t>=r.end){ S.research.splice(S.research.indexOf(r),1); finish(r); }
  if(S.lift.build&&t>=S.lift.build.end){ S.lift.build=null; S.lift.phase++; S.lift.dep={}; dirty(); emit('liftdone',S.lift.phase); }
  if(!S.drop.active&&t>=S.drop.next) spawnDrop();
}
function emptyTiles(zf){ const o=[]; for(let i=0;i<ZONES.length;i++){ if(!zoneOpen(i)||(zf&&!zf(i))) continue; const r=ZONES[i].r;
  for(let x=r[0];x<=r[2];x++) for(let y=r[1];y<=r[3];y++) if(zoneOf(x,y)===i&&tileInfo(x,y).kind==='empty') o.push({x,y,z:i}); } return o; }
function spawnDrop(){ const e=emptyTiles(i=>i===0); const p=e.length?e:emptyTiles(); if(!p.length){S.drop.next=now()+600000;return;}
  const t=p[Math.floor(Math.random()*p.length)]; Object.assign(S.drop,{active:true,x:t.x,y:t.y}); emit('drop'); }
function claimDrop(){ if(!S.drop.active) return; const r={credits:Math.round(120*(1+tier())*(0.8+Math.random()*.4)),cores:1+(Math.random()<.3?1:0)}; if(Math.random()<.12) r.chips=1;
  if(Math.random()<.1) r.drives=1; S.drop.active=false; S.drop.next=now()+3*3600*1000; grant(r); passXP(30); toast('Supply drop: '+rewardText(r),'good'); }

function pool(){ const u=unl(), s=new Set(); for(const k in RECIPES) if(u.has('r:'+k)) Object.keys(RECIPES[k].out).forEach(o=>s.add(o)); for(const n of nodes()) if(n.res!=='geyser') s.add(n.res); return [...s]; }
function targetN(it){ const n=Math.max(3,Math.round(1500/(ITEMS[it].v+4))); return n>20?Math.round(n/5)*5:n; }
function genContracts(dk,salt){ const p=pool(), r=rng(hstr(dk+'|'+salt+'|'+S.launches)), picks=[];
  let guard=0; while(picks.length<Math.min(3,p.length)&&guard++<100){const i=p[Math.floor(r()*p.length)]; if(!picks.includes(i)) picks.push(i);}
  return picks.map((it,j)=>{const n=targetN(it); return {it,n,kind:j===2?'ship':'make',start:made(it),prog:0,claimed:false,cr:Math.round(n*ITEMS[it].v*4+150),cores:ITEMS[it].v>=40?2:1};}); }
function ensurePeriodic(){
  const dk=dayKey(); if(!S.daily||S.daily.day!==dk) S.daily={day:dk,rerolls:1,c:genContracts(dk,0)};
  const wk=weekKey(); if(!S.weekly||S.weekly.week!==wk){ const p=pool(), r=rng(hstr('w'+wk+S.launches)); const cand=p.filter(i=>ITEMS[i].v>=3); const L2=cand.length?cand:p;
    const it=L2[Math.floor(r()*L2.length)]; S.weekly={week:wk,it,start:made(it),base:targetN(it)*2,stage:0}; }
  const sk=seasonKey(); if(!S.pass||S.pass.season!==sk) S.pass={season:sk,xp:0,free:[],prem:[],premium:false};
}
const contractProg = c => Math.min(c.n, c.kind==='make'?Math.floor(made(c.it)-c.start):c.prog);
function shipContract(i){ const c=S.daily.c[i]; const g=Math.min(Math.floor(S.inv[c.it]||0),c.n-c.prog); if(g<=0) return toast('No '+ITEMS[c.it].n+' in storage','bad'); S.inv[c.it]-=g; c.prog+=g; emit('change'); }
function claimContract(i){ const c=S.daily.c[i]; if(c.claimed||contractProg(c)<c.n) return; c.claimed=true; const r={credits:c.cr,cores:c.cores}; grant(r); emit('contract',c); passXP(60); toast('Contract complete: '+rewardText(r),'good'); }
function reroll(){ if(S.daily.rerolls<=0) return toast('No rerolls left today'); S.daily.rerolls--; const fresh2=genContracts(S.daily.day,Math.random()*1e9|0); S.daily.c=S.daily.c.map((c,i)=>c.claimed?c:(fresh2[i]||c)); emit('change'); }
const weeklyProg = () => Math.floor(made(S.weekly.it)-S.weekly.start);
const weeklyTarget = st => S.weekly.base*WEEKLY_STAGES[st].m;
function claimWeekly(){ const w=S.weekly; if(w.stage>=WEEKLY_STAGES.length||weeklyProg()<weeklyTarget(w.stage)) return; const r=WEEKLY_STAGES[w.stage].r; w.stage++; grant(r); passXP(100); toast('Weekly directive: '+rewardText(r),'good'); }
const canLogin = () => S.login.last!==dayKey();
function claimLogin(){ if(!canLogin()) return; const y=dayKey(now()-DAY); S.login.streak = S.login.last===y ? S.login.streak+1 : 1; S.login.last=dayKey();
  const r={...LOGIN_REWARDS[(S.login.streak-1)%7]}; if(r.credits) r.credits=Math.round(r.credits*(1+tier()*.5)); grant(r); passXP(40); toast(`Day ${S.login.streak} reward: `+rewardText(r),'good'); }
// pass
const passTier = () => Math.min(PASS.tiers, Math.floor(S.pass.xp/PASS.xpPer));
function passXP(x){ if(S.pass) S.pass.xp+=x; }
function claimPass(track,i){ const P=S.pass; if(i>=passTier()) return; const L2=P[track]; if(L2.includes(i)) return; if(track==='prem'&&!P.premium) return toast('Unlock the Frontier Pass in the Store','bad');
  L2.push(i); const r=PASS[track](i); grant(r); toast('Pass reward: '+rewardText(r),'good'); }

// ---------- expeditions ----------
function startExp(id){ if(!has('f:drone')) return; if(S.exped.length>=S.drones) return toast('All drones are out','bad'); const e=EXPEDITIONS.find(e=>e.id===id); if(e.req&&!S.ms[e.req]) return toast('Research '+MS[e.req].n+' first','bad');
  if(!canPay(e.cost)) return toast('Need '+missing(e.cost),'bad'); pay(e.cost); S.exped.push({id,end:now()+e.t*1000}); emit('change'); }
function collectExp(i){ const x=S.exped[i]; if(!x||now()<x.end) return; const e=EXPEDITIONS.find(e=>e.id===x.id); S.exped.splice(i,1);
  const r={credits:Math.round(80*e.lvl*e.lvl*(0.8+Math.random()*.4)),cores:e.lvl+(Math.random()<.5?1:0)}; if(Math.random()<.2*e.lvl) r.chips=e.lvl>=4?2:1;

  toast(msg,'good'); emit('change'); }
function findNode(){ const t=emptyTiles(); if(!t.length) return null; const p=t[Math.floor(Math.random()*t.length)]; const z=ZONES[p.z];
  const res=z.res||['iron_ore','limestone','copper_ore'].filter(r=>r==='iron_ore'||has('z:'+(r==='copper_ore'?1:2)));
  const rr=Math.random(); const n={x:p.x,y:p.y,res:res[Math.floor(Math.random()*res.length)],p:rr<.3?2:rr<.8?1:0}; S.extraNodes.push(n); dirty(); emit('focus',n); return n; }

// ---------- stores ----------
function addSurge(sec){ S.surgeEnd=Math.max(S.surgeEnd,now())+sec*1000; }
function warp(sec){ const res=runFor(sec); toast(`Time Warp: +${fmtTime(sec)} of production`,'good'); emit('warp',res); return res; }
function addSkin(k){ if(!S.skins.includes(k)) S.skins.push(k); S.skin=k; dirty(); }
function grant(r){ if(r.shards){ S.shards+=r.shards; } if(r.drives) S.drives+=r.drives; if(r.credits) S.credits+=r.credits; if(r.cores) S.cores+=r.cores; if(r.chips) S.chips+=r.chips;
  if(r.items) for(const k in r.items) S.inv[k]=(S.inv[k]||0)+r.items[k];
  if(r.skin){ const s=WEEKLY_SKINS.find(k=>!S.skins.includes(k)); if(s){ addSkin(s); toast('New belt skin: '+SKINS[s].n,'good'); } else S.cores+=15; }
  if(r.warp) warp(r.warp*3600); emit('change'); }
function rewardText(r){ const o=[]; if(r.shards) o.push(r.shards+' Flux Shard'+(r.shards>1?'s':'')); if(r.drives) o.push(r.drives+' Survey Log'); if(r.credits) o.push(fmt(r.credits)+' Credits'); if(r.cores) o.push(r.cores+(r.cores>1?' Cores':' Core')); if(r.chips) o.push(r.chips+' Chip'+(r.chips>1?'s':''));
  if(r.items) for(const k in r.items) o.push(fmt(r.items[k])+' '+ITEMS[k].n); if(r.skin) o.push('Belt skin'); if(r.warp) o.push(r.warp+'h Time Warp'); return o.join(' · '); }
const exPrice = p => Math.round(p.price*Math.pow(p.grow||1,S.bought[p.id]||0));
function buyEx(id){ const p=EXCHANGE.find(p=>p.id===id); if(p.once&&S.bought[id]) return; const c=exPrice(p); if(S.credits<c) return toast('Not enough Credits','bad');
  S.credits-=c; S.bought[id]=(S.bought[id]||0)+1;
  if(id==='chip') S.chips++; if(id==='cores3') S.cores+=3; if(id==='surge') addSurge(1800); if(id==='skin_brass') addSkin('brass');
  toast('Purchased '+p.n,'good'); emit('change'); }
function buyPrem(id){ const p=PREMIUM.find(p=>p.id===id); if(p.once&&S.bought[id]) return; if(p.req&&!S.bought[p.req]) return toast('Requires the previous upgrade','bad');
  if(S.cores<p.cores) return toast('Not enough Data Cores','bad'); S.cores-=p.cores; S.bought[id]=(S.bought[id]||0)+1;
  ({warp1:()=>warp(3600),warp4:()=>warp(4*3600),surge2:()=>addSurge(7200),chips3:()=>S.chips+=3,slot2:()=>S.slots=Math.max(S.slots,2),slot3:()=>S.slots=3,
    drone2:()=>S.drones=2,bslot:()=>startJobs(now()),skin_neon:()=>addSkin('neon'),skin_frost:()=>addSkin('frost')})[id]();
  toast('Purchased '+p.n,'good'); emit('change'); }
// Called after a successful store transaction (Google Play Billing in the Android build).
function iapGrant(sku){ const p=IAP.find(p=>p.sku===sku); if(!p) return; if(p.once&&S.iapOnce[sku]) return toast('Already owned');
  if(p.cores) S.cores+=p.cores;

// ---------- goals (guided onboarding) ----------
const hasR = r => S.buildings.some(b=>b.r===r);
const GOALS = [
  {t:'Tap a glowing iron node, then place a Drill Rig on it', ok:()=>count('miner')>=1, hint:'node'},
  {t:'Tap an empty tile → build a Smelting Furnace → Iron Ingot', ok:()=>hasR('iron_ingot')},
  {t:'Build a Fabricator making Iron Sheet', ok:()=>hasR('iron_plate')},
  {t:'Build a Fabricator making Iron Bar', ok:()=>hasR('iron_rod')},
  {t:'Research → deliver parts for Field Operations', ok:()=>S.ms.m_field||msState('m_field')==='running'},
  {t:'Research Fasteners, then make Rivets', ok:()=>hasR('screw')},
  {t:'Research Copper Survey to reveal Copper Ridge', ok:()=>S.ms.m_copper},
  {t:'Mine copper and make Copper Wire and Insulated Cable', ok:()=>hasR('wire')&&hasR('cable')},
  {t:'Research Masonry and produce Concrete', ok:()=>hasR('concrete')},

];
function goal(){ for(const g of GOALS) if(!g.ok()) return g;
  if(S.lift.phase>=LIFT.length) return {t:'The launch vehicle is ready. Tap the Orbital Lift to launch'};
  const m=MILESTONES.find(m=>['open','ready'].includes(msState(m.id))); if(m) return {t:'Next research: '+m.n};
  if(!S.lift.build) return {t:'Deliver parts for Orbital Lift '+LIFT[S.lift.phase].n}; return {t:'Expand production and upgrade your machines'}; }

// ---------- save / load ----------

  h += Object.entries(G.HAND).filter(([,x])=>!x.req||G.has(x.req)).map(([k,x])=>`<div class="row line">${ic(x.o||k,'i','ic lg')}<div class="grow"><b>${ITEMS[x.o||k].n} ×${x.n}</b>${cost(x.in)}</div><div class="row gap">${btn('×1','craft',{it:k,n:1},'pri',!G.canPay(x.in))}${btn('×10','craft',{it:k,n:10},'',!G.canPay(x.in))}${btn('Max','craft',{it:k,n:9999},'',!G.canPay(x.in))}</div></div>`).join('') + '</div>';
  const fb=s.belts.filter(x=>x.from==='core'); h += `<div class="card"><div class="row"><div class="ttl grow">Feed belts</div><span class="muted sm">${fb.length} out</span></div><div class="desc">The Core can feed stored materials to nearby machines and generators.</div>${fb.map(x=>{ const t=s.buildings.find(q=>q.id===x.to); return `<div class="row line"><span class="grow">→ ${t?BUILDINGS[t.t].n:'?'} · ${x.path.length} tiles</span>${btn('Remove','beltrm',{id:x.id},'sm danger')}</div>`; }).join('')}${btn('Draw feed belt','beltdraw',{id:'core'},'pri wide')}</div>`;
  const M=G.mods();
  h += `<div class="card"><div class="ttl">Engineer record</div><div class="kv"><span>Launches</span><b>${s.launches}</b><span>Global output</span><b>×${M.glob.toFixed(2)}</b><span>Research speed</span><b>×${M.research.toFixed(2)}</b><span>Credits earned</span><b>${f(s.stats.credits)}</b><span>Buildings</span><b>${s.buildings.length}</b><span>Offline cap</span><b>${4+G.lv('u_off')}h</b></div></div>`;
  return {title:'Core', body:h};
};
SH.lift = () => {
  const s=S(), ph=s.lift.phase; let h='';
  if(ph>=LIFT.length){ h += `<div class="card hero"><div class="ttl big">Launch vehicle ready</div><div class="desc">Launch to a new world. Your factory resets, nodes reshuffle, and you keep Cores, Chips, skins, store unlocks and 10% of Credits. Every launch adds +25% global output and +10% research speed forever.</div>${btn('Launch','launchAsk',{},'pri big wide')}</div>`; }
  else { const L=LIFT[ph], b=s.lift.build;
    h += `<div class="card hero"><div class="eyebrow">Current phase</div><div class="ttl big">${L.n}</div><div class="desc">${L.unl}</div>${cost(L.cost,s.lift.dep)}`;
    if(b){ const p=(now()-b.start)/(b.end-b.start); h += `<div class="muted">Constructing · ${ft((b.end-now())/1000)} left</div>${bar(p,'acc')}${btn(`Rush · ${G.rushCost(b.end)} Cores`,'liftrush',{},'core wide')}`; }
    else h += covered(L.cost,s.lift.dep)?btn('Deliver & start construction','liftdep',{},'pri wide'):btn('Deliver what you have','liftdep',{},'wide');
    h += '</div>'; }
  h += `<div class="phases">${LIFT.map((L,i)=>`<div class="ph ${i<ph?'done':i===ph?'now':''}"><b>${i+1}</b><span>${L.n.split('· ')[1]}</span></div>`).join('')}</div>`;
  return {title:'Orbital Lift', body:h};
};
SH.research = () => {
  const s=S(), tab=cur.tab||'ms'; let h='';
  h += `<div class="bays">${Array.from({length:s.slots},(_,i)=>{ const r=s.research[i]; if(!r) return `<div class="bay idle">Bay ${i+1} idle</div>`;
    const nm=r.kind==='m'?G.MS[r.id].n:r.kind==='a'?'Analyse: '+D.ALTS[r.id].n:r.kind==='s'?'Shard Tech: '+D.SHARD_TECH.find(x=>x.id===r.id).n:`${G.UP[r.id].n} Lv ${G.lv(r.id)+1}`, p=(now()-r.start)/(r.end-r.start);
    return `<div class="bay"><div class="row"><b class="grow">${nm}</b><span class="mono">${ft((r.end-now())/1000)}</span></div>${bar(p,'acc')}${btn(`Rush · ${G.rushCost(r.end)} Cores`,'rush',{id:r.id},'sm core')}</div>`; }).join('')}</div>`;
  if(tab==='ms'){
    const gate={2:'Orbital Lift Phase 1',3:'Orbital Lift Phase 2'}; let lastTier=-1; const done=[];
    for(const m of MILESTONES){ const st=G.msState(m.id); if(st==='done'){done.push(m);continue;}
      if(m.tier!==lastTier){ lastTier=m.tier; h += `<div class="tierhead">Era ${m.tier}${gate[m.tier]?` <small>needs ${gate[m.tier]}</small>`:''}</div>`; }
      if(st==='locked'){ h += `<div class="card locked mini"><b>${m.n}</b><span class="lock">Requires ${(m.req||[]).map(r=>r.startsWith('lift')?'Lift Phase '+r.slice(4):G.MS[r].n).join(', ')}</span></div>`; continue; }
      h += `<div class="card ${st}"><div class="row"><div class="ttl grow">${m.n}</div><span class="mono muted">${ft(G.resDur('m',m.id)/1000)}</span></div>${m.d?`<div class="desc">${m.d}</div>`:''}<div class="tags">${m.unl.map(unl).join('')}</div>`;
      if(st==='running'){ const r=s.research.find(r=>r.id===m.id); h += `<div class="muted">Researching · ${ft((r.end-now())/1000)}</div>${bar((now()-r.start)/(r.end-r.start),'acc')}`; }
      else { const dp=s.dep[m.id]||{}, shOk=!m.shards||(dp.shards||0)+s.shards>=m.shards; h += cost(m.cost,dp)+(m.shards?`<div class="cost"><span class="ci ${shOk?'ok':''}"><i class="g-sh"></i><b>${Math.min(m.shards,(dp.shards||0)+s.shards)}/${m.shards}</b><em>Flux Shards</em></span></div>`:''); h += st==='ready'?btn(s.research.length<s.slots?'Start research':'All bays busy','startms',{id:m.id},'pri wide',s.research.length>=s.slots):(covered(m.cost,s.dep[m.id]||{})&&shOk?btn(s.research.length<s.slots?'Start research':'Deposit · all bays busy','dep',{id:m.id},'pri wide'):btn('Deposit what you have','dep',{id:m.id},'wide')); }
      h += '</div>'; }
    if(done.length) h += `<div class="tierhead">Completed</div><div class="donelist">${done.map(m=>`<span>✓ ${m.n}</span>`).join('')}</div>`;
  } else if(tab==='st'){
    h += `<div class="card hero"><div class="row"><div class="grow"><div class="eyebrow">Flux Shards</div><div class="ttl big">${s.shards}</div></div>${btn('2 Shards → Survey Log','shard2drive',{},'',s.shards<2)}</div>${bar(s.rp/G.quota(),'acc')}<div class="muted sm">${f(s.rp)} / ${f(G.quota())} Reclaim Points to the next Shard. ${G.hasReclaimer()?'Feed your Matter Reclaimer to earn more.':'Build a Matter Reclaimer (research Matter Reclamation) to start earning.'} Shard Tech is permanent and survives Launches.</div></div>`;
    h += D.SHARD_TECH.map(t=>{ const done=s.stech[t.id], run=s.research.find(r=>r.id===t.id), lock=t.req&&!s.stech[t.req];
      return `<div class="card ${done?'ready':lock?'locked':''}"><div class="row"><div class="ttl grow">${t.n}</div><span class="mono muted">${done?'✓':ft(t.t/G.mods().research)}</span></div><div class="desc">${t.d}</div>`+(done?'':run?`<div class="muted">Researching · ${ft((run.end-now())/1000)}</div>${bar((now()-run.start)/(run.end-run.start),'acc')}`:lock?`<div class="lock">Requires ${D.SHARD_TECH.find(x=>x.id===t.req).n}</div>`:btn(`Research · ${t.sh} Shards`,'starttech',{id:t.id},'pri wide',s.shards<t.sh||s.research.length>=s.slots))+'</div>'; }).join('');
  } else if(tab==='alt'){
    h += `<div class="balance">${s.drives} Survey Log${s.drives===1?'':'s'} <small>found by scout drones and supply drops</small></div>`;
    h += Object.entries(D.ALTS).map(([id,a])=>{ const o=Object.keys(a.out)[0], done=s.alts[id], run=s.research.find(r=>r.id===id), ok=s.ms[a.req];
      return `<div class="card ${done?'ready':ok?'':'locked'}"><div class="row">${ic(o,'i','ic lg')}<div class="grow"><div class="ttl">${a.n} <span class="pill">ALT</span></div><div class="rx">${Object.entries(a.in).map(([k,v])=>`${ic(k)}${v}`).join('<span class="op">+</span>')}<span class="op">→</span>${ic(o)}${a.out[o]} <small>/min · ${BUILDINGS[a.b].n}</small></div></div><span class="mono muted">${done?'':ft(a.t/G.mods().research)}</span></div>`+
        (done?'<div class="muted sm">Unlocked. Pick it in the machine\'s Recipe tab.</div>':run?`<div class="muted">Analysing · ${ft((run.end-now())/1000)}</div>${bar((now()-run.start)/(run.end-run.start),'acc')}`:!ok?`<div class="lock">Requires ${G.MS[a.req].n}</div>`:cost(a.cost)+btn('Analyse · 1 Survey Log','startalt',{id},'pri wide',s.drives<1||!G.canPay(a.cost)||s.research.length>=s.slots))+'</div>'; }).join('');
  } else {
    if(!G.has('f:upgrades')) h += `<div class="card locked">Research <b>Process Science</b> (Era 1) to unlock repeatable upgrades.</div>`;
    else h += UPGRADES.map(u=>{ if(u.req&&!s.ms[u.req]) return `<div class="card locked"><div class="ttl">${u.n}</div><div class="desc">${u.d}</div><div class="lock">Research: ${G.MS[u.req].n}</div></div>`; const L=G.lv(u.id), max=u.max&&L>=u.max, run=s.research.some(r=>r.id===u.id), c=G.upCost(u.id);
      return `<div class="card"><div class="row"><div class="ttl grow">${u.n} <small>Lv ${L}${u.max?'/'+u.max:''}</small></div><span class="mono muted">${max?'':ft(G.upTime(u.id)/G.mods().research)}</span></div><div class="desc">${u.id==='u_belt'?`Now ${D.BELTS[L].n}: ${D.BELTS[L].cap}/min per machine${max?'':` → ${D.BELTS[L+1].n}: ${D.BELTS[L+1].cap}/min`}`:u.d}</div>${max?'<div class="muted">Maxed</div>':run?'<div class="muted">Researching…</div>':cost(c)+btn('Start','startup',{id:u.id},'pri wide',!G.canPay(c)||s.research.length>=s.slots)}</div>`; }).join('');
  }
  return {title:'Research', tabs:seg([['ms','Projects'],['up','Upgrades'],['alt','Variants'],['st','Shard Tech']],tab), body:h};
};
SH.storage = () => {
  const s=S(), c=G.cap(), P=G.RT.power, rec=G.count('recycler')>0; let h='';
  h += `<div class="card"><div class="row"><div class="ttl grow">Power grid</div><b class="mono">${P.dem.toFixed(0)} / ${P.cap.toFixed(0)} MW</b></div>${bar(P.cap?P.dem/P.cap:0,P.f<1?'bad':'pw')}<div class="muted">${P.f<1?`Overloaded: machines run at ${(P.f*100).toFixed(0)}%. Build generators.`:'Grid stable.'}</div></div>`;
  h += `<div class="row between muted sm"><span>Capacity ${f(c)} per item</span><span>${rec?'Reclaimer on: overflow → Credits + Reclaim Points':'Build a Matter Reclaimer to reclaim overflow'}</span></div>`;
  const items=Object.keys(ITEMS).filter(k=>(s.inv[k]||0)>=1||Math.abs(G.RT.rate[k]||0)>.05);
  h += items.map(k=>{ const v=s.inv[k]||0, r=G.RT.rate[k]||0;
    return `<div class="inv">${ic(k,'i','ic lg')}<div class="grow"><div class="row"><b class="grow">${ITEMS[k].n}</b><span class="mono">${f(v)}</span><span class="mono rate ${r>.05?'up':r<-.05?'down':''}">${r>=0?'+':''}${r.toFixed(1)}/m</span></div>${bar(v/c,v>=c?'full':'')}</div>${rec?btn(s.sink[k]===false?'Keep':'Reclaim','sink',{it:k},'sm '+(s.sink[k]===false?'':'on')):''}</div>`; }).join('') || '<div class="muted">Storage is empty.</div>';
  return {title:'Storage', body:h};
};
function badges(){ const s=S(); return {
  daily: G.canLogin()||s.daily.c.some(c=>!c.claimed&&G.contractProg(c)>=c.n)||s.drop.active,
  weekly: s.weekly.stage<WEEKLY_STAGES.length&&G.weeklyProg()>=G.weeklyTarget(s.weekly.stage),
  pass: Array.from({length:G.passTier()},(_,i)=>i).some(i=>!s.pass.free.includes(i)||(s.pass.premium&&!s.pass.prem.includes(i))),
  drones: s.exped.some(x=>now()>=x.end) }; }
SH.ops = () => {

  if(tab==='daily'){
    const st=s.login.streak, can=G.canLogin(), nextDay=can?(s.login.last===G.dayKey(now()-864e5)?st:0):st-1;
    h += `<div class="card"><div class="row"><div class="ttl grow">Daily supply</div><span class="muted">Streak ${st}</span></div><div class="days">${LOGIN_REWARDS.map((r,i)=>`<div class="day ${i<(nextDay%7)||(!can&&i===(nextDay%7))?'got':''} ${can&&i===nextDay%7?'today':''}"><small>Day ${i+1}</small><span>${G.rewardText(r).replace(/ · /g,'<br>')}</span></div>`).join('')}</div>${can?btn('Claim today','login',{},'pri wide'):`<div class="muted c">Next supply in ${ft((G.nextMidnight()-now())/1000)}</div>`}</div>`;
    h += `<div class="row between"><div class="tierhead">Contracts</div><span class="muted sm">Refresh in ${ft((G.nextMidnight()-now())/1000)} ${s.daily.rerolls?'· '+btn('Reroll','reroll',{},'sm'):''}</span></div>`;

    h += `<div class="card row">${s.drop.active?`<div class="grow"><div class="ttl">Supply drop landed</div><div class="muted">Tap the beacon on the map to open it.</div></div>${btn('Find it','locateDrop',{},'pri')}`:`<div class="grow"><div class="ttl">Next supply drop</div><div class="muted">Lands in ${ft((s.drop.next-now())/1000)}</div></div>`}</div>`;

    h += `<div class="card"><div class="eyebrow">Weekly directive</div><div class="row">${ic(w.it,'i','ic lg')}<div class="grow"><div class="ttl">Produce ${ITEMS[w.it].n}</div><div class="muted">${f(p)} made this week</div></div></div>
      <div class="stages">${WEEKLY_STAGES.map((x,i)=>`<div class="stg ${i<w.stage?'got':i===w.stage?'now':''}"><b>${f(w.base*x.m)}</b><small>${G.rewardText(x.r)}</small></div>`).join('')}</div>
      ${allDone?'<div class="muted c">Directive complete. New one on Monday.</div>':bar(p/tgt,'acc')+btn(p>=tgt?'Claim stage '+(w.stage+1):`${f(p)} / ${f(tgt)}`,'claimw',{},'pri wide',p<tgt)}</div>`;
  } else if(tab==='pass'){
    const P=s.pass, T=G.passTier();
    h += `<div class="card hero"><div class="row"><div class="grow"><div class="eyebrow">Frontier Pass · Season ${P.season%1000}</div><div class="ttl big">Tier ${T} / ${PASS.tiers}</div></div>${P.premium?'<span class="pill s-run">Premium</span>':btn('Unlock premium','tab',{t:'shop',st:'packs'},'core')}</div>

SH.item = k => {
  const s=S(), v=s.inv[k]||0, c=G.cap(), r=G.RT.rate[k]||0, res=s.reserve[k]||0, rec=G.count('recycler')>0;
  const prod=s.buildings.filter(b=>(b.r&&RECIPES[b.r].out[k])||((b.t==='miner'||b.t==='pump')&&(G.nodeAt(b.x,b.y)||{}).res===k)).length;
  const use=s.buildings.filter(b=>b.r&&RECIPES[b.r].in[k]).length;

      <div class="muted sm">vs ${a.war.oppName} · ${a.war.oppMembers} members · ${us>=th?'You are ahead':'You are behind by '+f(th-us)}</div>
      <div class="kv"><span>Your points this week</span><b>${f(a.myWeek)}</b><span>Win</span><b>30 Cores · 2 Chips · 60 Medals</b><span>Loss</span><b>10 Cores · 20 Medals</b></div></div>

  } else if(tab==='members'){ h += A.members().map((m,k)=>`<div class="inv ${m.me?'me':''}"><b class="mono rk">${k+1}</b><div class="grow">${m.n}</div><span class="mono">${f(m.w)}</span></div>`).join('') + btn('Leave alliance','aleaveAsk',{},'danger wide');

// ---------------- sheet control ----------------
function render(){ if(!cur) return; const o=SH[cur.k](cur.arg); if(!o){ close(); return; }
  $('#sh-title').textContent=o.title; $('#sh-tabs').innerHTML=o.tabs||''; $('#sh-body').innerHTML=o.body; }
let histArmed=false; const armBack=()=>{ if(!histArmed){ try{ history.pushState({ff:1},''); histArmed=true; }catch(e){} } };
window.addEventListener('popstate',()=>{ histArmed=false; if(!$('#modal').hidden){ closeModal(); armBack(); } else if(R.beltMode){ endBelt(); } else if(R.placing||R.decorMode){ endPlace(); } else if(cur){ close(); } });
function open(k,arg,tab){ armBack(); const same=cur&&cur.k===k&&cur.arg===arg; cur={k,arg,tab:tab||(same?cur.tab:null)}; $('#sheet').hidden=false; render(); if(!same) $('#sh-body').scrollTop=0; navActive(); }
function close(){ cur=null; $('#sheet').hidden=true; R.setSel(null); navActive(); }
function navActive(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',!!cur&&b.dataset.t===cur.k)); }
function startBelt(id){ const b=G.getSrc(id); if(!b) return; close(); endPlace(); R.setBeltMode({from:b,path:[],to:null},updBelt); R.setSel(null); $('#beltbar').hidden=false; updBelt(); R.focus(b.x,b.y); }
function endBelt(){ R.setBeltMode(null); $('#beltbar').hidden=true; }
function updBelt(){ const bm=R.beltMode; if(!bm) return; const n=bm.path.length, c=G.beltCost(n), tn=bm.to==null?null:bm.to==='core'?'Core':BUILDINGS[(S().buildings.find(t=>t.id===bm.to)||{t:'storage'}).t].n;
  $('#belttxt').innerHTML=`<b>${G.isStore(bm.from)?'Feed belt':'Belt'} from ${bm.from.id==='core'?'Core':BUILDINGS[bm.from.t].n}</b><span>${tn?`→ ${tn} · `:'Drag to lay tiles, then tap a green building to connect · '}${n} tile${n===1?'':'s'} · ${c.iron_plate} Iron Sheet</span>`; $('#beltok').disabled=bm.to==null; }
function applySettings(){ const st=S().settings, app=document.getElementById('app'); app.classList.toggle('tilt',st.tilt===true); app.classList.toggle('light',st.light!==false); }
function startDecor(t){ close(); endPlace(); const d=D.DECOR[t]; R.setDecor({t,k:d.k,brush:true,erase:false,onPaint:(x,y)=>decorTap(x,y,true)}); $('#placebar').hidden=false; updDecor(); }
function updDecor(){ const m=R.decorMode; if(!m) return; const d=D.DECOR[m.t]; let n=Infinity; for(const k in d.cost) n=Math.min(n,Math.floor((S().inv[k]||0)/d.cost[k]));
  $('#placetxt').innerHTML=`<span><b>${m.erase?'Erasing foundations':d.n}</b> · ${m.k==='floor'?(m.brush?'tap or drag to paint':'drag to pan, tap to paint'):'tap a free tile'} · ${m.erase?'':`materials for ${n}`}</span>${m.k==='floor'?`<button class="btn sm ${m.brush?'on':''}" data-a="decorbrush">${m.brush?'Brush':'Pan'}</button><button class="btn sm ${m.erase?'on':''}" data-a="decorerase">Erase</button>`:''}`; }
function endDecor(){ R.setDecor(null); $('#placebar').hidden=true; }
function decorTap(x,y,drag){ const m=R.decorMode; if(!m) return; const key=x+','+y;
  if(m.k==='floor'){ if(m.erase||(!drag&&S().floors[key]===m.t)) G.eraseFloor(x,y); else if(G.paintFloor(m.t,x,y,drag)) buzz(4); }
  else { if(G.placeDecor(m.t,x,y)) R.burst(x,y); }
  updDecor(); }
const buzz=ms=>{ try{ if(S().settings.haptics!==false&&navigator.vibrate) navigator.vibrate(ms); }catch(e){} };
function startPlace(t){ close(); R.setPlacing(t); $('#placebar').hidden=false; updPlace(); if(!R.validCount()) toast(BUILDINGS[t].node?'No free matching nodes. Research or scout for more.':'No free tiles. Research to reveal zones.','bad'); }
let moving=null;
function startMove(id){ const b=S().buildings.find(t=>t.id===id); if(!b) return; close(); endBelt(); moving=b; R.setPlacing(b.t); R.setSel({x:b.x,y:b.y}); $('#placebar').hidden=false; updPlace(); if(!R.validCount()) toast(BUILDINGS[b.t].node?'No free matching node to move to':'No free tiles','bad'); }
function endPlace(){ R.setDecor(null); R.setPlacing(null); moving=null; R.setSel(null); $('#placebar').hidden=true; }
function updPlace(){ const t=R.placing; if(!t) return; if(moving){ $('#placetxt').innerHTML=`${ic(t,'b')}<span><b>Moving ${BUILDINGS[t].n}</b> · tap a green ${BUILDINGS[t].node?'node':'tile'}. Belts re-route automatically.</span>`; return; } const d=BUILDINGS[t]; let n=Infinity; for(const k in d.cost) n=Math.min(n,Math.floor((S().inv[k]||0)/d.cost[k]));
  $('#placetxt').innerHTML=`${ic(t,'b')}<span><b>${d.n}</b> · tap a green tile · materials for ${n}</span>`; }
function afterPlace(b){ R.burst(b.x,b.y); R.setSel(b);
  if(BUILDINGS[b.t].cat==='Production'){ endPlace(); open('building',b.id,'recipe'); R.focus(b.x,b.y); }
  else if(R.placing){ if(!G.canPay(BUILDINGS[b.t].cost)||!R.validCount()) endPlace(); else updPlace(); }
  else close(); }

// ---------------- modal / toast ----------------
function modal(html){ $('#modal-card').innerHTML=html; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; }
function toast(m,k=''){ const box=$('#toasts'); const same=[...box.children].find(e=>e.textContent===m&&!e.classList.contains('out'));
  if(same){ clearTimeout(same._t); same._t=setTimeout(()=>{same.classList.add('out'); setTimeout(()=>same.remove(),400);},2600); same.classList.remove('bump'); void same.offsetWidth; same.classList.add('bump'); return; }
  const t=document.createElement('div'); t.className='toast '+k; t.textContent=m; box.appendChild(t); while(box.children.length>2) box.firstChild.remove(); t._t=setTimeout(()=>{t.classList.add('out'); setTimeout(()=>t.remove(),400);},2600); if(k==='bad') buzz(20); }
function gainsList(g){ return `<div class="gains">${g.gains.slice(0,8).map(([k,v])=>`<span>${ic(k)}<b>+${f(v)}</b></span>`).join('')}${g.credits?`<span>${cr(g.credits)}<b>Credits</b></span>`:''}</div>`; }
function offline(o){ modal(`<div class="eyebrow">Welcome back, Engineer</div><h2>Your factory kept running</h2><p class="muted">Away ${ft(o.away)}${o.away>o.sec?` · production capped at ${ft(o.sec)} (raise with Autonomous Ops)`:''}.</p>${o.gains.length||o.credits?gainsList(o):'<p class="muted">Nothing was produced. Build miners and machines to earn while away.</p>'}${btn('Collect','mclose',{},'pri wide')}`); }
function intro(){ modal(`<div class="eyebrow">Planet survey · Landing Meadow</div><h2>Build the Orbital Lift</h2><p>Your drop pod landed on an untouched world. Mine its ore, chain machines into production lines, and deliver parts to the Orbital Lift to unlock new eras.</p><p class="muted">Tap a glowing node to mine it. Tap empty ground to build. Pinch to zoom, drag to pan.</p>${btn('Start building','intro',{},'pri wide')}`); }

function onTap(x,y){
  if(R.beltMode){ const bm=R.beltMode, ti=G.tileInfo(x,y), tgt=ti.kind==='core'?'core':ti.kind==='building'?ti.b.id:null;
    if(tgt!=null&&tgt!==bm.from.id){ if(!G.validTarget(bm.from,tgt)) return toast('That building can\'t take this output','bad'); const last=bm.path.length?bm.path[bm.path.length-1]:[bm.from.x,bm.from.y];
      if(G.tgtFoot(tgt).some(g=>G.adj(g,last))){ bm.to=tgt; } else { const p=G.route(bm.from,tgt); if(!p) return toast('No clear path. Drag the belt yourself.','bad'); bm.path=p; bm.to=tgt; } updBelt(); return; }
    R.beltStep(x,y); return; }
  if(R.decorMode){ decorTap(x,y,false); return; }
  if(R.placing&&moving){ const m=moving; if(G.moveBuilding(m.id,x,y)){ endPlace(); R.setSel(m); open('building',m.id); } return; }
  if(R.placing){ const b=G.place(R.placing,x,y); if(b) afterPlace(b); return; }
  const ti=G.tileInfo(x,y);
  switch(ti.kind){
    case 'core': R.setSel({x:D.CORE.x,y:D.CORE.y,w:2,h:2}); open('core'); break;
    case 'lift': R.setSel({x:D.LIFTPOS.x,y:D.LIFTPOS.y,w:2,h:2}); open('lift'); break;
    case 'building': R.setSel(ti.b); open('building',ti.b.id); break;
    case 'node': { const a=G.handMine(ti.node); if(a) R.float(x,y,`+${a} ${ITEMS[ti.node.res].n}`,'#ffe7a8'); R.setSel(ti.node); if(!(cur&&cur.k==='node'&&cur.arg===ti.node.id)) open('node',ti.node.id); break; }
    case 'drop': G.claimDrop(); R.burst(x,y); break;
    case 'empty': if(cur&&cur.k!=='build'){ close(); break; } R.setSel({x,y}); open('build',{x,y}); break;
    case 'belt': R.setSel({x,y}); open('belt',x+'_'+y); break;
    case 'decor': R.setSel({x,y}); open('decor',ti.d.id); break;
    case 'obstacle': R.setSel({x,y}); open('obstacle',x+'_'+y); break;
    case 'locked': { const m=MILESTONES.find(m=>m.unl.includes('z:'+ti.z)); toast(`${ZONES[ti.z].n} is locked. Research ${m?m.n:''}.`); close(); break; }
    default: close();
  }
}

  G.on('focus',n=>R.focus(n.x,n.y));
  G.on('shard',n=>toast(`+${n} Flux Shard${n>1?'s':''}! Spend them in Research → Shard Tech`,'good'));
  G.on('ascend',b=>{ const a=D.LEVELS.ASC[b.asc-1]; R.ascendFx(b); modal(`<div class="eyebrow" style="color:${a.c}">Ascension complete</div><h2>${BUILDINGS[b.t].n} is now ${a.n}</h2><p>Output ×${G.bMult(b).toFixed(1)} at Lv 1. Level it again to push even higher.</p>${btn('Admire it','mclose',{},'pri wide')}`); });
  G.on('drop',()=>toast('A supply drop just landed near the Core','good'));
  R.init($('#world'),onTap);
  // swipe the panel header down to close; no long-press menus anywhere
  { let sy=null; const h=$('.sh-head'); h.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; sy=e.clientY; try{ h.setPointerCapture(e.pointerId); }catch(_){} }); h.addEventListener('pointermove',e=>{ if(sy!=null&&e.clientY-sy>70){ sy=null; close(); } }); ['pointerup','pointercancel'].forEach(k=>h.addEventListener(k,()=>{ sy=null; })); }
  document.addEventListener('contextmenu',e=>e.preventDefault());
  setInterval(()=>{ if(cur&&!hold&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(); },1000);
  setInterval(hud,250); hud(); setInterval(tutTick,200); if(S().intro&&!S().tutDone&&S().tut==null&&S().buildings.length<=2) S().tut=0; tutRender();
  const cyc=()=>{ const el=document.getElementById('cyc'); if(el){ const b=G.S.buildings.find(b=>b.id===+el.dataset.bid), bi=document.getElementById('cyc-b');
      if(b&&bi){ const or=(b._s==='run'||b._s==='low')?(b._or||0):0, tt=document.getElementById('cyc-t'), ss=document.getElementById('cyc-s');
        if(or>.01){ const per=60/or, p=(((b._acc||0)+or/60*(Date.now()-(b._t||Date.now()))/1000)%1+1)%1; bi.style.width=(p*100).toFixed(1)+'%'; tt.textContent=per<1?`${(1/per).toFixed(1)} per sec`:`${per.toFixed(1)}s each`; ss.textContent=`${or.toFixed(1)}/min · next in ${((1-p)*per).toFixed(1)}s`; }
        else { bi.style.width='0%'; tt.textContent='Stalled'; ss.textContent=ST[b._s]||'Waiting'; } } } requestAnimationFrame(cyc); }; requestAnimationFrame(cyc); setInterval(side,500); side();
}
return {init, open, close, toast, modal, offline, intro};
})();
</script>
<script>'use strict';
// ===== Factory Frontier — boot =====
(() => {
  const off = G.load();
  UI.init();
  setInterval(G.tick, 200);
  const flush = () => G.save();
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  window.addEventListener('pagehide', flush);
  if (!G.S.intro) UI.intro(); else if (off && (off.gains.length || off.credits)) UI.offline(off);
  window.__MF = { G, R, UI }; // debug handle
})();
</script>
